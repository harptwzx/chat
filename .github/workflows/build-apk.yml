name: 构建 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 补齐 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"
      - name: 安装 Godot 4.7 与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0-stable
          use-dotnet: false
          include-templates: true
      - name: 预加热并安装 Android 构建模板
        run: |
          timeout 180 godot --headless --editor --quit || true
          # 手动创建 android 构建模板目录
          mkdir -p android/build
          # 从 Godot 安装目录复制 Android 源码模板
          GODOT_LIB=$(godot --headless --script -e "print(OS.get_executable_path())" 2>/dev/null || echo "")
          # 或者直接从 GitHub 下载对应版本的源码模板
          wget -q https://github.com/godotengine/godot/releases/download/4.7.0-stable/godot-4.7.0-stable.tar.xz -O /tmp/godot-src.tar.xz
          tar -xf /tmp/godot-src.tar.xz -C /tmp/
          cp -r /tmp/godot-4.7.0-stable/platform/android/java/* android/build/ 2>/dev/null || true
      - name: 导出 APK（Debug 测试版）
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/snake_battle.apk
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-battle-apk-debug
          path: build/snake_battle.apk
