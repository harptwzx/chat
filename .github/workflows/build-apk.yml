name: 构建 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 补齐 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"
      - name: 安装 Godot 4.7 与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0-stable
          use-dotnet: false
          include-templates: true
      - name: 预加热（导入资源）
        run: |
          timeout 120 godot --headless --editor --quit || true
      - name: 导出 APK（Debug 测试版）
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/snake_battle.apk
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-battle-apk-debug
          path: build/snake_battle.apk
