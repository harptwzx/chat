name: 构建 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 补齐 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"
      - name: 安装 Godot 4.7 与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0-stable
          use-dotnet: false
          include-templates: true
      - name: 下载并安装 Android 构建模板
        run: |
          mkdir -p android/build
          # 从 Godot 源码仓库下载 Android 构建模板（对应 4.7.0 版本）
          wget -q "https://github.com/godotengine/godot/archive/refs/tags/4.7.0-stable.tar.gz" -O /tmp/godot-src.tar.gz
          tar -tzf /tmp/godot-src.tar.gz | head -5
          tar -xzf /tmp/godot-src.tar.gz -C /tmp/
          # 找到 android/java 目录
          ANDROID_SRC=$(find /tmp -path "*/platform/android/java" -type d | head -1)
          echo "Found Android source at: $ANDROID_SRC"
          if [ -n "$ANDROID_SRC" ] && [ -d "$ANDROID_SRC" ]; then
            cp -r "$ANDROID_SRC"/* android/build/
            echo "Android build template installed successfully"
            ls -la android/build/
          else
            echo "ERROR: Android build template not found"
            find /tmp -type d -name "java" | head -10
            exit 1
          fi
      - name: 预加热（导入资源）
        run: |
          timeout 120 godot --headless --editor --quit || true
      - name: 导出 APK（Debug 测试版）
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/snake_battle.apk
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-battle-apk-debug
          path: build/snake_battle.apk
