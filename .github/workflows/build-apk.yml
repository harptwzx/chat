name: 构建 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 补齐 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"
      - name: 安装 Godot 4.7 与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0-stable
          use-dotnet: false
          include-templates: true
      - name: 下载并安装 Android 构建模板
        run: |
          mkdir -p android/build
          # 下载 Godot 4.7.0 的 Android 源码模板
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.0-stable/godot-4.7.0-stable.tar.xz" -O /tmp/godot.tar.xz
          tar -tf /tmp/godot.tar.xz | head -20
          # 解压并找到 android 目录
          tar -xf /tmp/godot.tar.xz -C /tmp/
          # 查找 android/java 目录
          find /tmp -name "java" -type d | grep android || true
          find /tmp -path "*/android/java" -type d || true
          # 复制到项目
          ANDROID_SRC=$(find /tmp -path "*/platform/android/java" -type d | head -1)
          if [ -n "$ANDROID_SRC" ]; then
            cp -r "$ANDROID_SRC"/* android/build/
            echo "Android build template installed"
          else
            echo "Android build template not found in source"
            # 备用方案：尝试从 Godot 编辑器安装
            echo "Trying to install via Godot editor..."
            # 创建一个空的 project 让 Godot 能运行
            timeout 30 godot --headless --editor --quit || true
          fi
          ls -la android/build/ || true
      - name: 预加热（导入资源）
        run: |
          timeout 120 godot --headless --editor --quit || true
      - name: 导出 APK（Debug 测试版）
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/snake_battle.apk
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-battle-apk-debug
          path: build/snake_battle.apk
